# =============================================================================
# Weekly PostgreSQL Backup to Cloudflare R2
# =============================================================================
# Runs weekly, creates a compressed pg_dump of the database, and uploads it
# to a Cloudflare R2 bucket. Cleans up backups older than 26 weeks.
# Uses very few API requests per month (way below the 1 million free tier limit).
#
# Required GitHub Secrets:
#   DATABASE_URL             — PostgreSQL connection string
#   R2_ACCOUNT_ID            — Cloudflare account ID
#   R2_BUCKET_NAME           — Cloudflare R2 bucket name
#   R2_ACCESS_KEY_ID         — R2 Access Key ID
#   R2_SECRET_ACCESS_KEY     — R2 Secret Access Key
# =============================================================================

name: Weekly Database Backup to R2

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: weekly-db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create & Upload Backup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate Secrets
        run: |
          for secret in "${{ secrets.DATABASE_URL }}" "${{ secrets.R2_ACCOUNT_ID }}" "${{ secrets.R2_BUCKET_NAME }}" "${{ secrets.R2_ACCESS_KEY_ID }}" "${{ secrets.R2_SECRET_ACCESS_KEY }}"; do
            if [ -z "$secret" ]; then
              echo "❌ FAILED: Missing required database or R2 secret(s)."
              exit 1
            fi
          done
          echo "✅ All required secrets present."

      - name: Install PostgreSQL Client and AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client gzip awscli > /dev/null 2>&1
          echo "✅ Dependencies installed."

      - name: Generate Backup Name
        id: backup_name
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M")
          BACKUP_FILE="db-backup-${TIMESTAMP}.sql.gz"
          echo "file=${BACKUP_FILE}" >> $GITHUB_OUTPUT
          echo "📋 Backup file name: ${BACKUP_FILE}"

      - name: Create pg_dump and Compress
        run: |
          BACKUP_FILE="${{ steps.backup_name.outputs.file }}"
          echo "🔄 Running pg_dump..."
          
          # Use pg_dump with the connection string, output to gzip
          pg_dump "${{ secrets.DATABASE_URL }}" | gzip > "$BACKUP_FILE"
          
          # Check file size to ensure it's not empty
          SIZE=$(stat -c%s "$BACKUP_FILE")
          if [ "$SIZE" -lt 100 ]; then
            echo "❌ FAILED: Backup file is too small ($SIZE bytes). pg_dump may have failed."
            exit 1
          fi
          echo "✅ Backup created successfully ($SIZE bytes)."

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          BACKUP_FILE="${{ steps.backup_name.outputs.file }}"
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ secrets.R2_BUCKET_NAME }}"
          
          echo "☁️ Uploading to Cloudflare R2 bucket: ${{ secrets.R2_BUCKET_NAME }}"
          aws s3 cp "$BACKUP_FILE" "$BUCKET/$BACKUP_FILE" --endpoint-url "$ENDPOINT"
          echo "✅ Upload completed."

      - name: Cleanup Old Backups (Keep 26 weeks)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ secrets.R2_BUCKET_NAME }}"
          
          echo "🧹 Applying retention policy (keeping newest 26 backups)..."
          
          aws s3api list-objects-v2 \
            --bucket "${{ secrets.R2_BUCKET_NAME }}" \
            --endpoint-url "$ENDPOINT" \
            --query 'sort_by(Contents, &LastModified)[].Key' \
            --output text > all_backups.txt || true
          
          tr '\t' '\n' < all_backups.txt > backups_list.txt
          
          grep "^db-backup-.*\.sql\.gz$" backups_list.txt > filtered_backups.txt || true
          
          TOTAL=$(wc -l < filtered_backups.txt)
          
          if [ "$TOTAL" -gt 26 ]; then
            TO_DELETE=$((TOTAL - 26))
            echo "ℹ️ Found $TOTAL backups. Deleting the oldest $TO_DELETE backups..."
            head -n "$TO_DELETE" filtered_backups.txt | while read key; do
              if [ -n "$key" ]; then
                echo "🗑️ Deleting $key..."
                aws s3 rm "$BUCKET/$key" --endpoint-url "$ENDPOINT"
              fi
            done
            echo "✅ Cleanup completed."
          else
            echo "ℹ️ Found $TOTAL backups. No cleanup needed."
          fi
          
      - name: Weekly Backup Summary
        if: always()
        run: |
          echo "============================================="
          echo "  WEEKLY DATABASE BACKUP SUMMARY"
          echo "============================================="
          echo "  Backup File:         ${{ steps.backup_name.outputs.file }}"
          echo "  Completion Time:     $(date -u)"
          echo "  Status:              ${{ job.status }}"
          echo "============================================="
