# =============================================================================
# Backup-First Deployment
# =============================================================================
# For manual production deployments:
#   1. Creates a backup branch from main
#   2. Verifies the backup
#   3. Only then proceeds with deployment
#   4. After successful deployment, creates a post-deployment snapshot
#
# LIMITATION: If Vercel Git Integration is enabled, pushes to main will 
# deploy automatically and bypass this workflow. To enforce this backup-first 
# process, you must disable automatic Vercel Git deployments.
#
# Required GitHub Secrets:
#   NEON_API_KEY         — Neon API key
#   NEON_PROJECT_ID      — Neon project ID
#   NEON_MAIN_BRANCH_ID  — Branch ID of the main production branch
#   NEON_DATABASE_NAME   — Database name (e.g. neondb)
#   NEON_ROLE_NAME       — Database role name
#   VERCEL_TOKEN         — Vercel deployment token (if using Vercel)
# =============================================================================

name: Deploy with Backup

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "deploy" to confirm production deployment'
        required: true

concurrency:
  group: deploy-backup
  cancel-in-progress: false

env:
  NEON_API_BASE: https://console.neon.tech/api/v2

jobs:
  # =================================================================
  # JOB 1: Pre-deployment backup
  # =================================================================
  pre-deploy-backup:
    name: Pre-Deployment Backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      backup_branch_id: ${{ steps.create_branch.outputs.branch_id }}
      backup_branch_name: ${{ steps.branch_name.outputs.name }}

    steps:
      - name: Validate Secrets
        run: |
          for secret in "${{ secrets.NEON_API_KEY }}" "${{ secrets.NEON_PROJECT_ID }}" "${{ secrets.NEON_MAIN_BRANCH_ID }}" "${{ secrets.NEON_DATABASE_NAME }}" "${{ secrets.NEON_ROLE_NAME }}"; do
            if [ -z "$secret" ]; then
              echo "❌ FAILED: Missing required Neon secret(s)."
              exit 1
            fi
          done

      - name: Validate deployment confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "deploy" ]; then
            echo "❌ Deployment not confirmed. You must type 'deploy' to proceed."
            exit 1
          fi
          echo "✅ Deployment confirmed"

      - name: Generate backup branch name
        id: branch_name
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M")
          BRANCH_NAME="pre-deploy-${TIMESTAMP}"
          echo "name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "📋 Pre-deployment backup branch: ${BRANCH_NAME}"

      - name: Create pre-deployment backup branch
        id: create_branch
        run: |
          echo "🔄 Creating pre-deployment backup: ${{ steps.branch_name.outputs.name }}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${NEON_API_BASE}/projects/${{ secrets.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "branch": {
                "name": "${{ steps.branch_name.outputs.name }}",
                "parent_id": "${{ secrets.NEON_MAIN_BRANCH_ID }}"
              },
              "endpoints": [
                {
                  "type": "read_only"
                }
              ]
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ne 201 ]; then
            echo "❌ FAILED: Pre-deployment backup creation failed (HTTP ${HTTP_CODE})"
            echo "Response: ${BODY}"
            echo "🛑 DEPLOYMENT BLOCKED — backup must succeed before deploying"
            exit 1
          fi

          BRANCH_ID=$(echo "$BODY" | jq -r '.branch.id')
          echo "branch_id=${BRANCH_ID}" >> $GITHUB_OUTPUT
          echo "✅ Pre-deployment backup created: ${BRANCH_ID}"

      - name: Wait for backup branch to be ready
        run: |
          echo "⏳ Waiting for connection URI to become available..."
          BRANCH_ID="${{ steps.create_branch.outputs.branch_id }}"
          for i in $(seq 1 30); do
            RESPONSE=$(curl -s \
              "${NEON_API_BASE}/projects/${{ secrets.NEON_PROJECT_ID }}/connection_uri?branch_id=${BRANCH_ID}&database_name=${{ secrets.NEON_DATABASE_NAME }}&role_name=${{ secrets.NEON_ROLE_NAME }}" \
              -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}")

            URI=$(echo "$RESPONSE" | jq -r '.uri // empty')

            if [ -n "$URI" ] && [ "$URI" != "null" ]; then
              echo "✅ Connection URI obtained successfully"
              exit 0
            fi
            echo "  Attempt ${i}/30: Waiting for connection URI..."
            sleep 10
          done
          echo "❌ FAILED: Could not obtain connection URI within 5 minutes"
          echo "🛑 DEPLOYMENT BLOCKED"
          exit 1

      - name: Verify backup schema
        run: |
          BRANCH_ID="${{ steps.create_branch.outputs.branch_id }}"

          RESPONSE=$(curl -s \
            "${NEON_API_BASE}/projects/${{ secrets.NEON_PROJECT_ID }}/connection_uri?branch_id=${BRANCH_ID}&database_name=${{ secrets.NEON_DATABASE_NAME }}&role_name=${{ secrets.NEON_ROLE_NAME }}" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}")

          CONNECTION_URI=$(echo "$RESPONSE" | jq -r '.uri')

          if [ -z "$CONNECTION_URI" ] || [ "$CONNECTION_URI" = "null" ]; then
            echo "❌ FAILED: Could not get connection URI for backup"
            echo "🛑 DEPLOYMENT BLOCKED"
            exit 1
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client > /dev/null 2>&1

          echo "🔌 Connection Details:"
          echo "  Database: $(psql "$CONNECTION_URI" -tA -c "SELECT current_database();")"
          echo "  User:     $(psql "$CONNECTION_URI" -tA -c "SELECT current_user();")"
          echo "  Version:  $(psql "$CONNECTION_URI" -tA -c "SELECT version();")"

          TABLES=("Student" "Application" "Certificate" "Program")
          for TABLE in "${TABLES[@]}"; do
            RESULT=$(psql "$CONNECTION_URI" -t -c "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_name = '${TABLE}');" 2>&1)
            if echo "$RESULT" | grep -q 't'; then
              COUNT=$(psql "$CONNECTION_URI" -tA -c "SELECT COUNT(*) FROM \"${TABLE}\";")
              printf "✅ %-12s ...... %s rows\n" "${TABLE}" "${COUNT}"
            else
              echo "❌ FAILED: Table '${TABLE}' missing on backup"
              echo "🛑 DEPLOYMENT BLOCKED"
              exit 1
            fi
          done

          echo "✅ Pre-deployment backup fully verified"

  # =================================================================
  # JOB 2: Deploy (only runs if backup succeeds)
  # =================================================================
  deploy:
    name: Production Deployment
    needs: pre-deploy-backup
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ---------------------------------------------------------------
      # Add your deployment steps here.
      # Examples:
      #
      # For Vercel:
      #   - name: Deploy to Vercel
      #     run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
      #
      # For custom server:
      #   - name: Deploy via SSH
      #     run: ssh user@server "cd /app && git pull && npm ci && npm run build && pm2 restart all"
      # ---------------------------------------------------------------
      - name: Deploy placeholder
        run: |
          echo "============================================="
          echo "  DEPLOYMENT STEP"
          echo "============================================="
          echo "  Pre-deployment backup: ${{ needs.pre-deploy-backup.outputs.backup_branch_name }}"
          echo "  Backup branch ID: ${{ needs.pre-deploy-backup.outputs.backup_branch_id }}"
          echo ""
          echo "  ⚠️  Configure your actual deployment command above."
          echo "  This placeholder confirms the build succeeded."
          echo "============================================="

  # =================================================================
  # JOB 3: Post-deployment snapshot
  # =================================================================
  post-deploy-snapshot:
    name: Post-Deployment Snapshot
    needs: [pre-deploy-backup, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: success()

    steps:
      - name: Create post-deployment snapshot branch
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M")
          BRANCH_NAME="deployment-success-${TIMESTAMP}"

          echo "📸 Creating post-deployment snapshot: ${BRANCH_NAME}"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${NEON_API_BASE}/projects/${{ secrets.NEON_PROJECT_ID }}/branches" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"branch\": {
                \"name\": \"${BRANCH_NAME}\",
                \"parent_id\": \"${{ secrets.NEON_MAIN_BRANCH_ID }}\"
              }
            }")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ne 201 ]; then
            echo "⚠️  WARNING: Post-deployment snapshot failed (HTTP ${HTTP_CODE})"
            echo "Response: ${BODY}"
            echo "This does NOT affect the deployment — it succeeded already."
          else
            BRANCH_ID=$(echo "$BODY" | jq -r '.branch.id')
            echo "✅ Post-deployment snapshot created: ${BRANCH_NAME} (${BRANCH_ID})"
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "============================================="
          echo "  DEPLOYMENT COMPLETE"
          echo "============================================="
          echo "  Time (UTC):          $(date -u)"
          echo "  Git Commit SHA:      ${{ github.sha }}"
          echo "  GitHub Run ID:       ${{ github.run_id }}"
          echo "  Repository:          ${{ github.repository }}"
          echo "  Pre-deploy backup:   ${{ needs.pre-deploy-backup.outputs.backup_branch_name }}"
          echo "  Backup Branch ID:    ${{ needs.pre-deploy-backup.outputs.backup_branch_id }}"
          echo "  Deploy status:       ${{ needs.deploy.result }}"
          echo "  Neon Project ID:     ${{ secrets.NEON_PROJECT_ID }}"
          echo "  Neon Console:        https://console.neon.tech/app/projects/${{ secrets.NEON_PROJECT_ID }}/branches/${{ needs.pre-deploy-backup.outputs.backup_branch_id }}"
          echo "  Post-deploy snapshot: deployment-success-$(date -u +'%Y%m%d-%H%M')"
          echo "============================================="
